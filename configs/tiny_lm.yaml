# Tiny language-model config for pipeline verification
# Start from random weights. CPU-friendly.

model:
  vocab_size: 1024
  n_embd: 128
  n_head: 4
  n_layer: 4
  block_size: 128
  dropout: 0.1
  bias: true

training:
  batch_size: 8
  learning_rate: 3.0e-4
  weight_decay: 0.1
  max_iters: 200
  eval_interval: 50
  eval_iters: 20
  grad_clip: 1.0
  warmup_iters: 20
  seed: 42
  device: "cpu"
  dtype: "float32"

data:
  train_path: "data/processed/tiny_train.txt"
  val_path: "data/processed/tiny_val.txt"
  tokenizer_path: "data/checkpoints/tokenizer"

checkpoint:
  dir: "data/checkpoints/tiny_lm"
  save_interval: 100
  keep_last: 3

logging:
  log_interval: 10
