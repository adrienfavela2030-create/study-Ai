<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Study AI" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Study AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <section id="view-home" class="view active">
      <header class="top">
        <div class="brand-row">
          <span class="logo">S</span>
          <div>
            <h1>Study AI</h1>
            <p class="sub">Your school dashboard</p>
          </div>
        </div>
      </header>
      <p class="welcome">Choose a tool</p>
      <div class="dash">
        <button type="button" class="card" data-go="homework">
          <span class="card-icon">1</span>
          <span class="card-title">Homework AI</span>
          <span class="card-desc">Solve questions · 3 modes</span>
        </button>
        <button type="button" class="card" data-go="notes">
          <span class="card-icon">2</span>
          <span class="card-title">AI Notes</span>
          <span class="card-desc">Light · Medium · Hard · Short</span>
        </button>
        <button type="button" class="card" data-go="learn">
          <span class="card-icon">3</span>
          <span class="card-title">Learn With AI</span>
          <span class="card-desc">Chat + web research</span>
        </button>
      </div>
      <p class="foot-note">Works on your phone · Web research uses live Wikipedia</p>
    </section>

    <section id="view-homework" class="view">
      <header class="tool-bar">
        <button type="button" class="back" data-go="home">Back</button>
        <h2>Homework AI</h2>
      </header>
      <div class="tool-body">
        <p class="help">Paste your question. Pick how you want help.</p>
        <label class="label">Mode</label>
        <div class="segmented" id="hw-modes">
          <button type="button" class="seg active" data-mode="help">Help me understand</button>
          <button type="button" class="seg" data-mode="answer">Give the answer</button>
          <button type="button" class="seg" data-mode="both">Answer + explain</button>
        </div>
        <label class="label" for="hw-nums">Question # (optional)</label>
        <input id="hw-nums" class="input" placeholder="e.g. 1, 3-5, all" />
        <label class="label" for="hw-text">Question</label>
        <textarea id="hw-text" class="textarea" rows="5" placeholder="Paste the homework question…"></textarea>
        <button id="hw-go" class="btn primary full" type="button">Solve</button>
        <div id="hw-out" class="result hidden"></div>
      </div>
    </section>

    <section id="view-notes" class="view">
      <header class="tool-bar">
        <button type="button" class="back" data-go="home">Back</button>
        <h2>AI Notes</h2>
      </header>
      <div class="tool-body">
        <p class="help">Paste textbook or class text. Choose a style.</p>
        <label class="label">Style</label>
        <div class="segmented" id="note-styles">
          <button type="button" class="seg active" data-style="light">Light</button>
          <button type="button" class="seg" data-style="medium">Medium</button>
          <button type="button" class="seg" data-style="hard">Hard</button>
          <button type="button" class="seg" data-style="short">Short</button>
        </div>
        <label class="label" for="notes-text">Your text</label>
        <textarea id="notes-text" class="textarea" rows="7" placeholder="Paste the page or notes…"></textarea>
        <button id="notes-go" class="btn primary full" type="button">Make notes</button>
        <div id="notes-out" class="result hidden"></div>
      </div>
    </section>

    <section id="view-learn" class="view">
      <header class="tool-bar">
        <button type="button" class="back" data-go="home">Back</button>
        <h2>Learn With AI</h2>
      </header>
      <div class="tool-body learn-body">
        <div id="chat" class="chat"></div>
        <label class="check">
          <input type="checkbox" id="learn-search" checked />
          Research the web
        </label>
        <div class="row">
          <input id="learn-input" class="input grow" placeholder="Ask or learn something…" />
          <button id="learn-go" class="btn primary" type="button">Send</button>
        </div>
        <div id="learn-sources" class="sources hidden"></div>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
