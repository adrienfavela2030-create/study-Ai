<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#212121"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Study AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#212121;color:#ececec;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;overflow:hidden}
button,input,textarea{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #2f2f2f;flex-shrink:0;min-height:52px}
.header h1{font-size:16px;font-weight:600}
.tabs{display:flex;gap:4px;background:#2f2f2f;border-radius:10px;padding:3px}
.tab{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;color:#8e8e8e}
.tab.on{background:#424242;color:#fff}
.pages{flex:1;min-height:0;overflow:hidden}
.page{display:none;flex-direction:column;height:100%;min-height:0}
.page.on{display:flex}
.chat{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:92%;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#2f2f2f;border-radius:18px 18px 4px 18px;padding:12px 14px}
.msg.bot{align-self:flex-start;padding:4px 2px}
.msg .live{color:#8e8e8e;font-size:13px}
.book{display:flex;gap:12px;margin-top:4px}
.book img{width:52px;height:78px;object-fit:cover;border-radius:6px;background:#2f2f2f;flex-shrink:0}
.composer{flex-shrink:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #2f2f2f}
.composer-inner{display:flex;align-items:flex-end;gap:8px;background:#2f2f2f;border-radius:24px;padding:8px 8px 8px 16px}
.composer-inner input{flex:1;background:transparent;outline:none;padding:8px 0;font-size:16px;min-width:0;-webkit-appearance:none;color:#ececec}
.composer-inner input::placeholder{color:#8e8e8e}
.send{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send svg{width:16px;height:16px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 28px}
.hint{font-size:14px;color:#8e8e8e;margin-bottom:14px}
.lbl{font-size:11px;font-weight:650;color:#8e8e8e;text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.field{display:block;width:100%;background:#2f2f2f;border:1px solid #3a3a3a;border-radius:12px;padding:12px 14px;font-size:16px;margin:0 0 12px;outline:none;color:#ececec;-webkit-appearance:none}
.field:focus{border-color:#666}
textarea.field{min-height:100px;resize:vertical}
.btn{display:block;width:100%;background:#fff;color:#000;border-radius:12px;padding:14px;font-size:15px;font-weight:650;margin-top:8px;text-align:center}
.btn2{display:block;width:100%;background:#2f2f2f;color:#ececec;border:1px solid #3a3a3a;border-radius:12px;padding:14px;font-size:15px;font-weight:650;margin-top:8px;text-align:center}
.row{display:flex;gap:8px}.row>*{flex:1;margin-top:0}
.up2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.up{position:relative;background:#2f2f2f;border:1px dashed #3a3a3a;border-radius:12px;padding:20px 10px;text-align:center;font-size:13px;font-weight:600}
.up small{display:block;color:#8e8e8e;font-weight:400;margin-top:4px;font-size:11px}
.up input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.preview{max-width:100%;max-height:120px;border-radius:10px;margin:0 0 12px;display:none;object-fit:cover}
.status{font-size:13px;color:#8e8e8e;margin:0 0 12px}
.status.ok{color:#4ade80}.status.warn{color:#fbbf24}.status.err{color:#f87171}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:#2f2f2f;border:1px solid #3a3a3a;color:#8e8e8e;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
.chip.on{background:#fff;color:#000;border-color:#fff}
.steps{display:flex;gap:6px;margin-bottom:14px}
.step{flex:1;height:3px;border-radius:2px;background:#3a3a3a}
.step.on{background:#fff}.step.done{background:#666}
.qitem{display:flex;gap:10px;align-items:flex-start;background:#2f2f2f;border-radius:12px;padding:12px;margin-bottom:8px}
.qitem input{margin-top:3px;width:18px;height:18px}.qitem label{flex:1;font-size:13px}
.panel{background:#2f2f2f;border-radius:12px;padding:14px;margin-top:12px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5;display:none}
.panel.show{display:block}
.panel .meta{font-size:11px;color:#8e8e8e;text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.open{display:flex}
.sheet{width:100%;max-width:480px;background:#2a2a2a;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:70vh;overflow-y:auto}
.sheet h3{font-size:17px;margin-bottom:6px}.sheet p{font-size:13px;color:#8e8e8e;margin-bottom:14px}
.sheet-btn{display:block;width:100%;text-align:left;background:#212121;border-radius:10px;padding:14px;margin-bottom:8px;font-weight:600;font-size:15px}
.sheet-btn small{display:block;font-weight:400;color:#8e8e8e;font-size:12px;margin-top:2px}
</style>
</head>
<body>
<div id="app">
<header class="header">
<h1>Study AI</h1>
<div class="tabs">
<button type="button" class="tab on" id="t-research">Research</button>
<button type="button" class="tab" id="t-hw">Homework</button>
<button type="button" class="tab" id="t-notes">Notes</button>
</div>
</header>
<div class="pages">
<div class="page on" id="p-research">
<div class="chat" id="chat"></div>
<div class="composer">
<div class="composer-inner">
<input type="text" id="r-input" placeholder="Ask anything…" autocomplete="off"/>
<button type="button" class="send" id="r-send" aria-label="Send"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg></button>
</div></div></div>
<div class="page" id="p-hw">
<div class="scroll">
<div class="steps" id="hw-steps"><div class="step on"></div><div class="step"></div><div class="step"></div><div class="step"></div></div>
<div id="hs1">
<p class="hint">Photo of the page, or type the questions.</p>
<div class="up2">
<label class="up">Camera<small>Take photo</small><input type="file" id="hw-cam" accept="image/*" capture="environment"/></label>
<label class="up">Upload<small>Photos</small><input type="file" id="hw-file" accept="image/*"/></label>
</div>
<img id="hw-img" class="preview" alt=""/>
<p class="status" id="hw-st"></p>
<p class="lbl">Text</p>
<textarea class="field" id="hw-text" placeholder="Type or edit questions"></textarea>
<button type="button" class="btn" id="hw-n1">Continue</button>
</div>
<div id="hs2" style="display:none">
<p class="hint">Select questions to help with.</p>
<div id="hw-qs"></div>
<div class="row"><button type="button" class="btn2" id="hw-b2">Back</button><button type="button" class="btn" id="hw-n2">Continue</button></div>
</div>
<div id="hs3" style="display:none">
<p class="lbl">Subject</p>
<button type="button" class="btn2" id="hw-subj">Choose subject</button>
<p class="status" id="hw-subj-st">Tap to choose</p>
<p class="lbl">Help style</p>
<div class="chips" id="hw-modes">
<button type="button" class="chip on" data-v="explain">Explain</button>
<button type="button" class="chip" data-v="answer">Answer</button>
<button type="button" class="chip" data-v="both">Both</button>
</div>
<div class="qitem" style="margin-bottom:12px">
<input type="checkbox" id="hw-essay"/><label for="hw-essay"><strong>Essay mode</strong></label>
</div>
<p class="lbl">Optional note</p>
<input class="field" id="hw-note" type="text" placeholder="e.g. only #2"/>
<div class="row"><button type="button" class="btn2" id="hw-b3">Back</button><button type="button" class="btn" id="hw-go">Get help</button></div>
</div>
<div id="hs4" style="display:none">
<div class="panel show" id="hw-out"></div>
<button type="button" class="btn2" id="hw-reset">Start over</button>
</div>
</div></div>
<div class="page" id="p-notes">
<div class="scroll">
<p class="hint">Photo, link, or paste text.</p>
<div class="up2">
<label class="up">Camera<small>Page</small><input type="file" id="n-cam" accept="image/*" capture="environment"/></label>
<label class="up">Upload<small>Photos</small><input type="file" id="n-file" accept="image/*"/></label>
</div>
<img id="n-img" class="preview" alt=""/>
<p class="status" id="n-st"></p>
<input class="field" id="n-url" type="url" placeholder="Or paste a link"/>
<button type="button" class="btn2" id="n-fetch">Load link</button>
<textarea class="field" id="n-text" placeholder="Or paste text"></textarea>
<p class="lbl">Length</p>
<div class="chips" id="n-modes">
<button type="button" class="chip on" data-v="short">Short</button>
<button type="button" class="chip" data-v="medium">Medium</button>
<button type="button" class="chip" data-v="long">Long</button>
</div>
<button type="button" class="btn" id="n-go">Make notes</button>
<div class="panel" id="n-out"></div>
</div></div>
</div></div>
<div class="overlay" id="ov">
<div class="sheet">
<h3>Subject</h3>
<p>Pick the best match.</p>
<div id="subj-list"></div>
<button type="button" class="btn2" id="ov-x">Cancel</button>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
(function(){
"use strict";
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function bind(id,ev,fn){var n=$(id);if(n)n.addEventListener(ev,fn);}
function show(name){
var pages=document.querySelectorAll(".page");
for(var i=0;i<pages.length;i++)pages[i].classList.remove("on");
var tabs=document.querySelectorAll(".tab");
for(var j=0;j<tabs.length;j++)tabs[j].classList.remove("on");
if(name==="research"){$("p-research").classList.add("on");$("t-research").classList.add("on");}
else if(name==="hw"){$("p-hw").classList.add("on");$("t-hw").classList.add("on");}
else if(name==="notes"){$("p-notes").classList.add("on");$("t-notes").classList.add("on");}
}
bind("t-research","click",function(){show("research");});
bind("t-hw","click",function(){show("hw");});
bind("t-notes","click",function(){show("notes");});
function setupChips(id,cb){
var root=$(id);if(!root)return;
root.addEventListener("click",function(e){
var t=e.target;if(!t.classList||!t.classList.contains("chip"))return;
var all=root.querySelectorAll(".chip");
for(var i=0;i<all.length;i++)all[i].classList.remove("on");
t.classList.add("on");cb(t.getAttribute("data-v"));
});
}
function isGib(t){
if(!t||t.length<8)return true;
var letters=(t.match(/[a-zA-Z]/g)||[]).length;
if(letters/t.length<0.4)return true;
var words=t.split(/\s+/).filter(Boolean);
if(words.length<3)return true;
var weird=0,singles=0;
for(var i=0;i<words.length;i++){
var w=words[i];
if(w.length===1&&!/[aAI]/.test(w))singles++;
if(w.length>=3&&!/[aeiouAEIOU]/.test(w)&&/[a-zA-Z]{3,}/.test(w))weird++;
}
return weird/words.length>0.35||singles/words.length>0.3;
}
function prepImg(file){
return new Promise(function(resolve){
var img=new Image(),url=URL.createObjectURL(file);
img.onload=function(){
try{
var maxW=1600,scale=img.width>maxW?maxW/img.width:(img.width<600?2:1.2);
var w=Math.round(img.width*scale),h=Math.round(img.height*scale);
var c=document.createElement("canvas");c.width=w;c.height=h;
var ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
var id=ctx.getImageData(0,0,w,h),d=id.data;
for(var i=0;i<d.length;i+=4){
var g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];g=(g-128)*1.35+128;
if(g<0)g=0;if(g>255)g=255;if(g>200)g=255;else if(g<90)g=0;
d[i]=d[i+1]=d[i+2]=g;
}
ctx.putImageData(id,0,0);URL.revokeObjectURL(url);
c.toBlob(function(b){resolve(b||file);},"image/png");
}catch(e){URL.revokeObjectURL(url);resolve(file);}
};
img.onerror=function(){URL.revokeObjectURL(url);resolve(file);};
img.src=url;
});
}
function runOCR(file,st,textEl,imgEl){
if(imgEl){try{imgEl.src=URL.createObjectURL(file);imgEl.style.display="block";}catch(e){}}
st.textContent="Reading…";st.className="status";
if(typeof Tesseract==="undefined"){st.textContent="Photo added. Type the text.";return;}
prepImg(file).then(function(img){
return Tesseract.recognize(img,"eng",{logger:function(m){
if(m&&m.status==="recognizing text"&&m.progress)st.textContent="Reading… "+Math.round(m.progress*100)+"%";
}});
}).then(function(r){
var t=(r&&r.data&&r.data.text)?r.data.text.replace(/\s+\n/g,"\n").replace(/[ \t]+/g," ").trim():"";
if(t&&t.length>5&&!isGib(t)){
textEl.value=textEl.value?(textEl.value+"\n\n"+t):t;
st.textContent="Text ready — fix if needed.";st.className="status ok";
}else{st.textContent="Could not read clearly. Type below.";st.className="status warn";}
}).catch(function(){st.textContent="Could not read photo.";st.className="status err";});
}
var hwMode="explain",hwQs=[],hwSubj="";
var SUBJECTS=[
{id:"english",label:"English / Reading",tip:"Stories, fables, poems"},
{id:"math",label:"Math",tip:"Numbers, word problems"},
{id:"science",label:"Science",tip:"Bio, chem, physics"},
{id:"history",label:"History",tip:"People, events"},
{id:"general",label:"General",tip:"Other"}
];
setupChips("hw-modes",function(v){hwMode=v;});
function hwStep(n){
var steps=$("hw-steps").children;
for(var i=0;i<steps.length;i++)steps[i].className="step"+(i+1<n?" done":(i+1===n?" on":""));
$("hs1").style.display=n===1?"block":"none";
$("hs2").style.display=n===2?"block":"none";
$("hs3").style.display=n===3?"block":"none";
$("hs4").style.display=n===4?"block":"none";
}
bind("hw-cam","change",function(){var f=this.files&&this.files[0];if(f)runOCR(f,$("hw-st"),$("hw-text"),$("hw-img"));});
bind("hw-file","change",function(){var f=this.files&&this.files[0];if(f)runOCR(f,$("hw-st"),$("hw-text"),$("hw-img"));});
function parseQs(text){
var lines=text.split(/\n/),qs=[],buf="";
var re=/^\s*(?:(?:question\s*)?\d+[\).:\-]|[Qq]\d+|#\s*\d+)/;
for(var i=0;i<lines.length;i++){
var line=lines[i].replace(/\s+$/,"");
if(!line.replace(/\s/g,""))continue;
if(re.test(line)&&buf){qs.push(buf.trim());buf=line;}
else buf=buf?(buf+" "+line):line;
}
if(buf.trim())qs.push(buf.trim());
if(qs.length<=1&&text.length>80){
var parts=text.replace(/\s+/g," ").split(/(?=\b\d+[\).]|#\s*\d+)/);qs=[];
for(var i=0;i<parts.length;i++){var p=parts[i].trim();if(p.length>12)qs.push(p);}
}
if(!qs.length)qs=[text.trim().slice(0,500)];
return qs.slice(0,12).map(function(q,i){return{n:i+1,text:q.slice(0,350)};});
}
function detectSubj(t){
t=t.toLowerCase();
if(/aesop|fable|fox|grasshopper|theme|character|poem|essay|story|moral|swollen/.test(t))return"english";
if(/\d\s*[\+\-\x\*\/=]|equation|algebra|fraction|percent|solve/.test(t))return"math";
if(/cell|atom|gravity|photosynthesis|biology|chemistry|physics/.test(t))return"science";
if(/war|century|revolution|history|ancient|president/.test(t))return"history";
return"general";
}
function subjLabel(id){for(var i=0;i<SUBJECTS.length;i++)if(SUBJECTS[i].id===id)return SUBJECTS[i].label;return id;}
bind("hw-n1","click",function(){
var t=$("hw-text").value.trim();
if(!t){$("hw-st").textContent="Add photo or type text.";$("hw-st").className="status warn";return;}
if(isGib(t)){$("hw-st").textContent="Text looks unreadable. Fix it.";$("hw-st").className="status warn";return;}
hwQs=parseQs(t);hwSubj=detectSubj(t);
var box=$("hw-qs");box.innerHTML="";
for(var i=0;i<hwQs.length;i++){
var q=hwQs[i],d=document.createElement("div");d.className="qitem";
d.innerHTML='<input type="checkbox" id="qq'+i+'" checked/><label for="qq'+i+'"><strong>#'+q.n+'</strong> — '+esc(q.text)+'</label>';
box.appendChild(d);
}
hwStep(2);
});
bind("hw-b2","click",function(){hwStep(1);});
bind("hw-n2","click",function(){
$("hw-subj").textContent=subjLabel(hwSubj);
$("hw-subj-st").textContent="Suggested: "+subjLabel(hwSubj);
hwStep(3);
});
bind("hw-b3","click",function(){hwStep(2);});
bind("hw-reset","click",function(){
$("hw-text").value="";$("hw-img").style.display="none";$("hw-st").textContent="";
$("hw-note").value="";$("hw-essay").checked=false;hwSubj="";hwStep(1);
});
bind("hw-subj","click",function(){
var list=$("subj-list");list.innerHTML="";
SUBJECTS.forEach(function(s){
var b=document.createElement("button");b.type="button";b.className="sheet-btn";
b.innerHTML=esc(s.label)+"<small>"+esc(s.tip)+"</small>";
b.onclick=function(){
hwSubj=s.id;$("hw-subj").textContent=s.label;$("hw-subj-st").textContent="Subject: "+s.label;
$("ov").classList.remove("open");
};
list.appendChild(b);
});
$("ov").classList.add("open");
});
bind("ov-x","click",function(){$("ov").classList.remove("open");});
$("ov").addEventListener("click",function(e){if(e.target===$("ov"))$("ov").classList.remove("open");});
function buildHelp(selected,subj,mode,essay,note){
var lines=["Subject: "+subjLabel(subj),"Mode: "+(mode==="explain"?"Explanation":mode==="answer"?"Answer":"Answer + Explanation")];
if(note)lines.push("Note: "+note);lines.push("");
for(var i=0;i<selected.length;i++){
var q=selected[i],qt=q.text;
lines.push("────────","Question #"+q.n,qt,"");
if(subj==="english"){
if(/fable|aesop|fox|grasshopper|swollen|moral|flies|hen and|wolf|miser|ants/i.test(qt)){
if(mode!=="answer")lines.push("How to read this fable","1. Characters","2. What happens","3. What goes wrong","4. The moral","5. Real-life example","");
if(mode!=="explain"){
lines.push("Answer guide");
if(/swollen fox/i.test(qt))lines.push("• Fox eats, gets too fat to leave.","• Moral: greed can trap you.");
else if(/flies|honey/i.test(qt))lines.push("• Flies stick to honey.","• Moral: careless pleasure can hurt you.");
else if(/golden|hen/i.test(qt))lines.push("• Owner kills the hen for all gold and loses everything.","• Moral: greed can ruin what you have.");
else if(/grasshopper|ants/i.test(qt))lines.push("• Ants prepare; grasshopper does not.","• Moral: prepare for the future.");
else if(/wolf|sheep/i.test(qt))lines.push("• Wolf hides in sheep clothing.","• Moral: don't trust looks alone.");
else lines.push("• Name characters + what happens.","• State the moral in one sentence.");
lines.push("","Draft: characters / plot / moral");
}
}else{
if(mode!=="answer")lines.push("1. Restate","2. Use a text detail","3. Explain");
if(mode!=="explain")lines.push("Answer in 2–4 sentences.","Draft: _______________");
}
}else if(subj==="math")lines.push("1. Given  2. Find  3. Method  4. Steps  5. Check","Work: _______________");
else if(subj==="science")lines.push("1. Concept  2. Cause→effect  3. Vocab  4. Example","Draft: _______________");
else if(subj==="history")lines.push("1. Who/what/when/where  2. Cause→effect  3. Why it mattered","Draft: _______________");
else lines.push("1. Restate  2. Answer fully  3. Use a detail","Draft: _______________");
if(essay||/essay|paragraph|write about/i.test(qt))lines.push("","Essay: intro · main idea · 2–3 points · conclusion");
lines.push("");
}
return lines.join("\n");
}
bind("hw-go","click",function(){
var selected=[];
for(var i=0;i<hwQs.length;i++){var cb=$("qq"+i);if(cb&&cb.checked)selected.push(hwQs[i]);}
if(!selected.length)selected=hwQs.slice(0,1);
if(!hwSubj)hwSubj=detectSubj(selected.map(function(q){return q.text;}).join(" "));
var body=buildHelp(selected,hwSubj,hwMode,$("hw-essay").checked,$("hw-note").value.trim());
$("hw-out").innerHTML='<div class="meta">Homework · '+esc(subjLabel(hwSubj))+'</div>'+esc(body);
hwStep(4);
});
var nStyle="short";
setupChips("n-modes",function(v){nStyle=v;});
bind("n-cam","change",function(){var f=this.files&&this.files[0];if(f)runOCR(f,$("n-st"),$("n-text"),$("n-img"));});
bind("n-file","change",function(){var f=this.files&&this.files[0];if(f)runOCR(f,$("n-st"),$("n-text"),$("n-img"));});
bind("n-fetch","click",function(){
var url=$("n-url").value.trim();
if(!url){$("n-st").textContent="Paste a link first.";return;}
if(!/^https?:\/\//i.test(url))url="https://"+url;
$("n-st").textContent="Loading…";
fetch("https://r.jina.ai/"+url).then(function(r){if(!r.ok)throw new Error();return r.text();}).then(function(t){
t=t.trim().slice(0,20000);if(t.length<40)throw new Error();
$("n-text").value=t;$("n-st").textContent="Loaded.";$("n-st").className="status ok";
}).catch(function(){$("n-st").textContent="Could not load. Paste text.";$("n-st").className="status warn";});
});
bind("n-go","click",function(){
var raw=$("n-text").value.trim();
if(!raw){$("n-out").className="panel show";$("n-out").textContent="Add text first.";return;}
var parts=raw.replace(/\s+/g," ").replace(/([.!?])/g,"$1\n").split("\n"),sents=[];
for(var i=0;i<parts.length;i++){var s=parts[i].trim();if(s.length>20)sents.push(s);}
if(!sents.length)sents=[raw.slice(0,200)];
var n=nStyle==="short"?Math.min(8,sents.length):nStyle==="medium"?Math.min(12,sents.length):Math.min(16,sents.length);
var picks=sents.slice(0,n),lines=[];
if(nStyle==="short"){lines.push("Short notes\n");for(var i=0;i<picks.length;i++)lines.push("• "+picks[i].slice(0,120));}
else if(nStyle==="medium"){lines.push("Medium notes\n");for(var i=0;i<picks.length;i++)lines.push((i+1)+". "+picks[i].slice(0,180));}
else{lines.push("Longer notes\n");for(var i=0;i<picks.length;i++)lines.push((i+1)+". "+picks[i].slice(0,200));}
$("n-out").className="panel show";
$("n-out").innerHTML='<div class="meta">'+esc(nStyle)+' notes</div>'+esc(lines.join("\n"));
});
var chat=$("chat");
var mem={title:"",author:""};
function addMsg(who,text){
var d=document.createElement("div");d.className="msg "+who;d.textContent=text;
chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}
function addHtml(html){
var d=document.createElement("div");d.className="msg bot";d.innerHTML=html;
chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}
addMsg("bot","Ask about any subject or book.\nExample: Restart by Gordon Korman");
function clean(msg){
var q=msg.trim(),lower=q.toLowerCase();
var p=["what is the ","what is ","explain ","tell me about ","about ","the book ","book called ","find ","search for ","look up "];
for(var i=0;i<p.length;i++)if(lower.indexOf(p[i])===0){q=q.slice(p[i].length);lower=q.toLowerCase();}
return q.replace(/[?.!]+$/,"").trim();
}
function isAuthorFollowup(raw){
if(!mem.title)return false;
if(/^(by|author|written by|the author is|author is)\s+/i.test(raw))return true;
if(/^[A-Z][a-zA-Z.\-']+(?:\s+[A-Z][a-zA-Z.\-']+){0,3}$/.test(raw.trim())&&raw.trim().split(/\s+/).length<=4)return true;
return false;
}
function resolve(msg){
var raw=msg.trim(),title="",author="";
var by=raw.match(/(.+?)\s+by\s+([A-Z][a-zA-Z.\-']+(?:\s+[A-Z][a-zA-Z.\-']+){0,3})/);
if(by){title=by[1].replace(/^(the book|book|novel)\s+/i,"").trim();author=by[2].trim();}
if(isAuthorFollowup(raw)){
author=raw.replace(/^(by|author is|the author is|author|written by)\s+/i,"").trim();
return{title:mem.title,author:author,book:true,note:'Searching "'+mem.title+'" by '+author};
}
if(!title)title=clean(raw);
var book=!!author||/\b(book|novel|author)\b/i.test(raw)||(title.split(/\s+/).length<=4&&title.length<=40);
return{title:title,author:author,book:book,note:""};
}
function noise(t){return /goku|dragon\s*ball|dragonball|naruto|one piece|anime|manga|pokemon|pokémon|minecraft|fortnite|roblox/i.test(t||"");}
function wantsNoise(q){return /goku|dragon\s*ball|anime|manga/i.test(q||"");}
function olSearch(title,author){
var url=(title&&author)
?"https://openlibrary.org/search.json?title="+encodeURIComponent(title)+"&author="+encodeURIComponent(author)+"&limit=8"
:"https://openlibrary.org/search.json?title="+encodeURIComponent(title)+"&limit=8";
return fetch(url).then(function(r){return r.json();}).then(function(data){
return(data.docs||[]).filter(function(d){return d.title;}).map(function(d){
return{title:d.title,authors:(d.author_name||[]).slice(0,3).join(", "),year:d.first_publish_year||"",key:d.key||"",cover:d.cover_i||null,subjects:(d.subject||[]).slice(0,6)};
});
});
}
function wikiSearch(q){
return fetch("https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch="+encodeURIComponent(q)+"&srlimit=5&format=json&origin=*")
.then(function(r){return r.json();})
.then(function(data){return((data.query&&data.query.search)||[]).map(function(x){return x.title;});});
}
function wikiExtract(title){
return fetch("https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&exchars=1800&titles="+encodeURIComponent(title)+"&format=json&origin=*")
.then(function(r){return r.json();})
.then(function(data){
var pages=data.query&&data.query.pages||{};
var k=Object.keys(pages)[0];if(!k||pages[k].missing!==undefined)return null;
var ex=(pages[k].extract||"").trim();if(!ex)return null;
return{title:pages[k].title,extract:ex.slice(0,1800)};
});
}
function bookDesc(key){
if(!key)return Promise.resolve("");
return fetch("https://openlibrary.org"+key+".json").then(function(r){return r.json();}).then(function(d){
var desc=d.description;if(!desc)return"";
if(typeof desc==="object"&&desc.value)desc=desc.value;
return typeof desc==="string"?desc.replace(/\s+/g," ").trim().slice(0,1000):"";
}).catch(function(){return"";});
}
function scoreBook(h,title,author){
var t=(h.title||"").toLowerCase(),q=(title||"").toLowerCase(),s=0;
if(t===q)s+=100;else if(t.indexOf(q)===0)s+=50;else if(t.indexOf(q)!==-1)s+=25;
if(author){
var a=(h.authors||"").toLowerCase(),hits=0;
author.toLowerCase().split(/\s+/).forEach(function(w){if(w.length>1&&a.indexOf(w)!==-1){s+=25;hits++;}});
if(hits===0)s-=50;
}
if(/guys write|anthology|collection/i.test(h.title)&&q.length<20)s-=30;
if(noise(h.title)&&!wantsNoise(title))s-=100;
return s;
}
function rewrite(raw){
if(!raw)return"";
var clean=raw.replace(/\s+/g," ").trim();
var bits=clean.replace(/([.!?])/g,"$1\n").split("\n"),out=[];
for(var i=0;i<bits.length&&out.length<5;i++){var s=bits[i].trim();if(s.length>25)out.push(s);}
return out.length?out.join(" "):clean.slice(0,450);
}
function doResearch(){
var input=$("r-input"),msg=input.value.trim();
if(!msg)return;
addMsg("user",msg);input.value="";
var live=addMsg("bot","");live.innerHTML='<span class="live">Searching…</span>';
var r=resolve(msg);
if(r.title&&!r.note)mem.title=r.title;
if(r.author)mem.author=r.author;
if(r.note)live.innerHTML='<span class="live">'+esc(r.note)+'</span>';
var title=r.title,author=r.author,wantBook=r.book||!!author;
var jobs=[];
if(title&&author)jobs.push(olSearch(title,author).catch(function(){return[];}));
jobs.push(olSearch(title,null).catch(function(){return[];}));
var wikiQ=author?(title+" "+author):(wantBook?(title+" novel"):title);
jobs.push(wikiSearch(wikiQ).catch(function(){return[];}));
Promise.all(jobs).then(function(results){
var books=[],wikiTitles=[],seenB={},seenW={};
for(var i=0;i<results.length;i++){
var arr=results[i]||[];
for(var j=0;j<arr.length;j++){
var item=arr[j];
if(typeof item==="string"){if(!seenW[item.toLowerCase()]){seenW[item.toLowerCase()]=1;wikiTitles.push(item);}}
else if(item&&item.title){var k=(item.title+"|"+(item.authors||"")).toLowerCase();if(!seenB[k]){seenB[k]=1;books.push(item);}}
}
}
if(!wantsNoise(title+" "+(author||""))){
books=books.filter(function(b){return!noise(b.title)&&!noise(b.authors);});
wikiTitles=wikiTitles.filter(function(t){return!noise(t);});
}
books.sort(function(a,b){return scoreBook(b,title,author)-scoreBook(a,title,author);});
live.innerHTML='<span class="live">Best match: '+(books[0]?books[0].title:(wikiTitles[0]||"…"))+'…</span>';
var top=books[0],useBook=top&&(author||scoreBook(top,title,author)>=20||wantBook);
var next=[];
if(useBook)next.push(bookDesc(top.key).then(function(d){top.desc=d;return top;}));
else next.push(Promise.resolve(null));
var wp=wikiTitles[0]||null;
if(wp)next.push(wikiExtract(wp).catch(function(){return null;}));
else next.push(Promise.resolve(null));
return Promise.all(next).then(function(p){return{book:p[0],wiki:p[1]};});
}).then(function(pack){
if(live.parentNode)live.parentNode.removeChild(live);
if(pack.book&&!(noise(pack.book.title)&&!wantsNoise(title))){
var b=pack.book,desc=rewrite(b.desc);
if(!desc&&pack.wiki)desc=rewrite(pack.wiki.extract);
if(!desc&&b.subjects&&b.subjects.length)desc="A book"+(b.year?" from about "+b.year:"")+". Tags: "+b.subjects.slice(0,4).join(", ")+".";
if(!desc)desc="Matched as a book"+(b.year?" (about "+b.year+")":"")+" by "+(b.authors||"unknown")+".";
var html="";
if(b.cover){
html+='<div class="book"><img src="https://covers.openlibrary.org/b/id/'+b.cover+'-M.jpg" alt="" onerror="this.style.display=\'none\'"/><div>';
html+='<strong>'+esc(b.title)+'</strong><br/><span style="color:#8e8e8e;font-size:13px">'+esc((b.authors||"")+(b.year?" · "+b.year:""))+'</span><br/><br/>'+esc(desc)+'</div></div>';
}else html='<strong>'+esc(b.title)+'</strong><br/><span style="color:#8e8e8e;font-size:13px">'+esc((b.authors||"")+(b.year?" · "+b.year:""))+'</span><br/><br/>'+esc(desc);
addHtml(html);mem.title=b.title;mem.author=b.authors||mem.author;
addMsg("bot","Wrong book? Type the author.");
return;
}
if(pack.wiki&&!(noise(pack.wiki.title)&&!wantsNoise(title))){
addHtml("<strong>"+esc(pack.wiki.title)+"</strong><br/><br/>"+esc(rewrite(pack.wiki.extract)));
mem.title=pack.wiki.title;return;
}
addMsg("bot","No solid match.\nTry: Restart by Gordon Korman");
}).catch(function(e){
if(live.parentNode)live.parentNode.removeChild(live);
addMsg("bot","Error: "+(e&&e.message?e.message:e));
});
}
bind("r-send","click",doResearch);
bind("r-input","keydown",function(e){if(e.key==="Enter"){e.preventDefault();doResearch();}});
hwStep(1);
})();
</script>
</body>
