<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Study AI" />
  <link rel="manifest" href="manifest.json" />
  <title>Study AI</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .screen { display: none !important; }
    .screen.is-on { display: flex !important; flex-direction: column !important; }
  </style>
</head>
<body>
  <div class="shell">
    <main class="stage">
      <section id="screen-home" class="screen is-on">
        <div class="home-center">
          <div class="home-logo">S</div>
          <h1 class="home-title">Study AI</h1>
          <p class="home-tag">What do you want to work on?</p>
          <div class="chips">
            <button type="button" class="chip" data-jump="homework">Homework</button>
            <button type="button" class="chip" data-jump="notes">Notes</button>
            <button type="button" class="chip" data-jump="learn">Learn</button>
          </div>
        </div>
      </section>
      <section id="screen-homework" class="screen">
        <div class="screen-head">
          <h2>Homework</h2>
          <p class="screen-sub">Paste a question · pick a mode</p>
        </div>
        <div class="screen-scroll">
          <div class="pills" id="hw-modes">
            <button type="button" class="pill active" data-mode="help">Help me understand</button>
            <button type="button" class="pill" data-mode="answer">Give answer</button>
            <button type="button" class="pill" data-mode="both">Answer + explain</button>
          </div>
          <input id="hw-nums" class="field" type="text" placeholder="Question # (optional)" autocomplete="off" />
          <textarea id="hw-text" class="field area" rows="5" placeholder="Paste your question here…"></textarea>
          <button id="hw-go" class="cta" type="button">Solve</button>
          <div id="hw-out" class="panel hidden"></div>
        </div>
      </section>
      <section id="screen-notes" class="screen">
        <div class="screen-head">
          <h2>Notes</h2>
          <p class="screen-sub">Paste text · choose a style</p>
        </div>
        <div class="screen-scroll">
          <div class="pills" id="note-styles">
            <button type="button" class="pill active" data-style="light">Light</button>
            <button type="button" class="pill" data-style="medium">Medium</button>
            <button type="button" class="pill" data-style="hard">Hard</button>
            <button type="button" class="pill" data-style="short">Short</button>
          </div>
          <textarea id="notes-text" class="field area" rows="7" placeholder="Paste textbook or class notes…"></textarea>
          <button id="notes-go" class="cta" type="button">Make notes</button>
          <div id="notes-out" class="panel hidden"></div>
        </div>
      </section>
      <section id="screen-learn" class="screen">
        <div class="screen-head">
          <h2>Learn</h2>
          <p class="screen-sub">Ask · research the web</p>
        </div>
        <div class="chat-wrap"><div id="chat" class="chat"></div></div>
        <div class="composer">
          <label class="toggle"><input type="checkbox" id="learn-search" checked /> <span>Web research</span></label>
          <div class="composer-row">
            <input id="learn-input" class="field grow" type="text" placeholder="Ask anything…" autocomplete="off" />
            <button id="learn-go" class="send" type="button">Go</button>
          </div>
          <div id="learn-sources" class="sources hidden"></div>
        </div>
      </section>
    </main>
    <nav class="tabbar">
      <button type="button" class="tab is-on" data-screen="home"><span class="tab-ic">Home</span></button>
      <button type="button" class="tab" data-screen="homework"><span class="tab-ic">Homework</span></button>
      <button type="button" class="tab" data-screen="notes"><span class="tab-ic">Notes</span></button>
      <button type="button" class="tab" data-screen="learn"><span class="tab-ic">Learn</span></button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
