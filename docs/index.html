<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta name="theme-color" content="#212121"/>
<title>Study AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#212121;color:#ececec;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;overflow:hidden}
button,input,textarea{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #2f2f2f;flex-shrink:0;min-height:52px;gap:8px}
.header h1{font-size:15px;font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:3px;background:#2f2f2f;border-radius:10px;padding:3px}
.tab{padding:8px 11px;border-radius:8px;font-size:12px;font-weight:600;color:#8e8e8e}
.tab.on{background:#424242;color:#fff}
.pages{flex:1;min-height:0;overflow:hidden}
.page{display:none;flex-direction:column;height:100%;min-height:0}
.page.on{display:flex}
.chat{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#2f2f2f;border-radius:18px 18px 4px 18px;padding:12px 14px}
.msg.bot{align-self:flex-start;padding:4px 2px}
.msg .live{color:#8e8e8e;font-size:13px}
.book{display:flex;gap:12px;margin-top:4px}
.book img{width:52px;height:78px;object-fit:cover;border-radius:6px;background:#2f2f2f;flex-shrink:0}
.composer{flex-shrink:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #2f2f2f}
.composer-row{display:flex;align-items:flex-end;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:#2f2f2f;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#ececec;font-size:20px;font-weight:600;line-height:1}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.composer-box{flex:1;display:flex;align-items:flex-end;gap:6px;background:#2f2f2f;border-radius:24px;padding:6px 6px 6px 14px;min-width:0}
.composer-box input{flex:1;background:transparent;outline:none;padding:10px 0;font-size:16px;min-width:0;-webkit-appearance:none;color:#ececec}
.composer-box input::placeholder{color:#8e8e8e}
.send{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send svg{width:16px;height:16px}
.attach-menu{display:none;gap:8px;padding:0 0 10px;flex-wrap:wrap}
.attach-menu.open{display:flex}
.attach-item{position:relative;background:#2f2f2f;border:1px solid #3a3a3a;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;text-align:center;min-width:90px}
.attach-item small{display:block;color:#8e8e8e;font-weight:400;font-size:11px;margin-top:2px}
.attach-item input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 28px}
.hint{font-size:14px;color:#8e8e8e;margin-bottom:14px}
.lbl{font-size:11px;font-weight:650;color:#8e8e8e;text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.field{display:block;width:100%;background:#2f2f2f;border:1px solid #3a3a3a;border-radius:12px;padding:12px 14px;font-size:16px;margin:0 0 12px;outline:none;color:#ececec;-webkit-appearance:none}
textarea.field{min-height:100px;resize:vertical}
.btn{display:block;width:100%;background:#fff;color:#000;border-radius:12px;padding:14px;font-size:15px;font-weight:650;margin-top:8px;text-align:center}
.btn2{display:block;width:100%;background:#2f2f2f;color:#ececec;border:1px solid #3a3a3a;border-radius:12px;padding:14px;font-size:15px;font-weight:650;margin-top:8px;text-align:center}
.row{display:flex;gap:8px}.row>*{flex:1;margin-top:0}
.up2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.up{position:relative;background:#2f2f2f;border:1px dashed #3a3a3a;border-radius:12px;padding:20px 10px;text-align:center;font-size:13px;font-weight:600}
.up small{display:block;color:#8e8e8e;font-weight:400;margin-top:4px;font-size:11px}
.up input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.preview{max-width:100%;max-height:120px;border-radius:10px;margin:0 0 12px;display:none;object-fit:cover}
.status{font-size:13px;color:#8e8e8e;margin:0 0 12px}
.status.ok{color:#4ade80}.status.warn{color:#fbbf24}.status.err{color:#f87171}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:#2f2f2f;border:1px solid #3a3a3a;color:#8e8e8e;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}
.chip.on{background:#fff;color:#000;border-color:#fff}
.steps{display:flex;gap:6px;margin-bottom:14px}
.step{flex:1;height:3px;border-radius:2px;background:#3a3a3a}
.step.on{background:#fff}.step.done{background:#666}
.qitem{display:flex;gap:10px;align-items:flex-start;background:#2f2f2f;border-radius:12px;padding:12px;margin-bottom:8px}
.qitem input{margin-top:3px;width:18px;height:18px}.qitem label{flex:1;font-size:13px}
.panel{background:#2f2f2f;border-radius:12px;padding:14px;margin-top:12px;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.5;display:none}
.panel.show{display:block}
.panel .meta{font-size:11px;color:#8e8e8e;text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.open{display:flex}
.sheet{width:100%;max-width:480px;background:#2a2a2a;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:70vh;overflow-y:auto}
.sheet h3{font-size:17px;margin-bottom:6px}.sheet p{font-size:13px;color:#8e8e8e;margin-bottom:14px}
.sheet-btn{display:block;width:100%;text-align:left;background:#212121;border-radius:10px;padding:14px;margin-bottom:8px;font-weight:600;font-size:15px}
.listening{background:#3b82f6!important;color:#fff!important}
</style>
</head>
<body>
<div id="app">
<header class="header">
<h1>Study AI <span style="font-size:10px;color:#8e8e8e;font-weight:500">v13</span></h1>
<div class="tabs">
<button type="button" class="tab on" id="t-research" onclick="show('research')">Research</button>
<button type="button" class="tab" id="t-hw" onclick="show('hw')">Homework</button>
<button type="button" class="tab" id="t-notes" onclick="show('notes')">Notes</button>
</div>
</header>
<div class="pages">
<div class="page on" id="p-research">
<div class="chat" id="chat"></div>
<div class="composer">
<div class="attach-menu" id="attach-menu">
<label class="attach-item">Camera<small>Take photo</small><input type="file" accept="image/*" capture="environment" onchange="attachFile(this,'camera')"/></label>
<label class="attach-item">Photos<small>Library</small><input type="file" accept="image/*" onchange="attachFile(this,'photo')"/></label>
<label class="attach-item">Files<small>Document</small><input type="file" accept="image/*,.pdf,.txt,.doc,.docx" onchange="attachFile(this,'file')"/></label>
</div>
<div class="composer-row">
<button type="button" class="icon-btn" id="btn-plus" onclick="toggleAttach()" title="Add">+</button>
<div class="composer-box">
<input type="text" id="r-input" placeholder="Ask anything…" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();doResearch();}"/>
<button type="button" class="icon-btn" id="btn-mic" onclick="toggleMic()" title="Mic" style="background:transparent;width:36px;height:36px">
<svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
</button>
<button type="button" class="send" onclick="doResearch()" title="Send">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
</button>
</div>
</div>
</div>
</div>
<div class="page" id="p-hw">
<div class="scroll">
<div class="steps" id="hw-steps"><div class="step on"></div><div class="step"></div><div class="step"></div><div class="step"></div></div>
<div id="hs1">
<p class="hint">Photo of the page, or type the questions.</p>
<div class="up2">
<label class="up">Camera<small>Take photo</small><input type="file" id="hw-cam" accept="image/*" capture="environment" onchange="hwPhoto(this)"/></label>
<label class="up">Upload<small>Photos / files</small><input type="file" id="hw-file" accept="image/*,.pdf,.txt" onchange="hwPhoto(this)"/></label>
</div>
<img id="hw-img" class="preview" alt=""/>
<p class="status" id="hw-st"></p>
<p class="lbl">Text</p>
<textarea class="field" id="hw-text" placeholder="Type or edit questions"></textarea>
<button type="button" class="btn" onclick="hwNext1()">Continue</button>
</div>
<div id="hs2" style="display:none">
<p class="hint">Select questions to help with.</p>
<div id="hw-qs"></div>
<div class="row"><button type="button" class="btn2" onclick="hwStep(1)">Back</button><button type="button" class="btn" onclick="hwNext2()">Continue</button></div>
</div>
<div id="hs3" style="display:none">
<p class="lbl">Subject</p>
<button type="button" class="btn2" id="hw-subj" onclick="pickSubj()">Choose subject</button>
<p class="status" id="hw-subj-st">Tap to choose</p>
<p class="lbl">Help style</p>
<div class="chips">
<button type="button" class="chip on" onclick="setMode(this,'explain')">Explain</button>
<button type="button" class="chip" onclick="setMode(this,'answer')">Answer</button>
<button type="button" class="chip" onclick="setMode(this,'both')">Both</button>
</div>
<div class="row"><button type="button" class="btn2" onclick="hwStep(2)">Back</button><button type="button" class="btn" onclick="hwGo()">Get help</button></div>
</div>
<div id="hs4" style="display:none">
<div class="panel show" id="hw-out"></div>
<button type="button" class="btn2" onclick="hwReset()">Start over</button>
</div>
</div>
</div>
<div class="page" id="p-notes">
<div class="scroll">
<p class="hint">Photo, link, or paste text.</p>
<div class="up2">
<label class="up">Camera<small>Page</small><input type="file" accept="image/*" capture="environment" onchange="notesPhoto(this)"/></label>
<label class="up">Upload<small>Photos / files</small><input type="file" accept="image/*,.txt,.pdf" onchange="notesPhoto(this)"/></label>
</div>
<img id="n-img" class="preview" alt=""/>
<p class="status" id="n-st"></p>
<input class="field" id="n-url" type="url" placeholder="Or paste a link"/>
<button type="button" class="btn2" onclick="notesFetch()">Load link</button>
<textarea class="field" id="n-text" placeholder="Or paste text"></textarea>
<p class="lbl">Length</p>
<div class="chips">
<button type="button" class="chip on" onclick="setNStyle(this,'short')">Short</button>
<button type="button" class="chip" onclick="setNStyle(this,'medium')">Medium</button>
<button type="button" class="chip" onclick="setNStyle(this,'long')">Long</button>
</div>
<button type="button" class="btn" onclick="makeNotes()">Make notes</button>
<div class="panel" id="n-out"></div>
</div>
</div>
</div>
</div>
<div class="overlay" id="ov" onclick="if(event.target===this)this.classList.remove('open')">
<div class="sheet">
<h3>Subject</h3>
<p>Pick the best match.</p>
<div id="subj-list"></div>
<button type="button" class="btn2" onclick="document.getElementById('ov').classList.remove('open')">Cancel</button>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function show(name){
var pages=document.querySelectorAll(".page");
for(var i=0;i<pages.length;i++) pages[i].classList.remove("on");
var tabs=document.querySelectorAll(".tab");
for(var j=0;j<tabs.length;j++) tabs[j].classList.remove("on");
if(name==="research"){ $("p-research").classList.add("on"); $("t-research").classList.add("on"); }
if(name==="hw"){ $("p-hw").classList.add("on"); $("t-hw").classList.add("on"); }
if(name==="notes"){ $("p-notes").classList.add("on"); $("t-notes").classList.add("on"); }
}
function toggleAttach(){
var m=$("attach-menu");
if(m.classList.contains("open")) m.classList.remove("open");
else m.classList.add("open");
}
function attachFile(input, kind){
var f=input.files && input.files[0];
if(!f) return;
$("attach-menu").classList.remove("open");
if(f.type && f.type.indexOf("image")===0){
runOCR(f, function(text){
if(text) $("r-input").value = ($("r-input").value ? $("r-input").value+" " : "") + text.slice(0,500);
else addMsg("bot","Could not read that image. Type your question.");
}, null);
} else {
addMsg("bot","File added: "+f.name+". Describe what you need in the box.");
}
input.value="";
}
var recog=null, listening=false;
function toggleMic(){
var SR=window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR){ addMsg("bot","Voice not supported on this browser."); return; }
if(listening && recog){ try{recog.stop();}catch(e){} listening=false; $("btn-mic").classList.remove("listening"); return; }
recog=new SR();
recog.lang="en-US";
recog.interimResults=false;
recog.onresult=function(ev){
var t="";
for(var i=0;i<ev.results.length;i++) t+=ev.results[i][0].transcript;
$("r-input").value=($("r-input").value?$("r-input").value+" ":"")+t;
};
recog.onend=function(){ listening=false; $("btn-mic").classList.remove("listening"); };
recog.onerror=function(){ listening=false; $("btn-mic").classList.remove("listening"); };
listening=true; $("btn-mic").classList.add("listening");
try{recog.start();}catch(e){ listening=false; $("btn-mic").classList.remove("listening"); }
}
function isGib(t){
if(!t||t.length<8) return true;
var letters=(t.match(/[a-zA-Z]/g)||[]).length;
if(letters/t.length<0.4) return true;
var words=t.split(/\s+/).filter(Boolean);
if(words.length<3) return true;
var weird=0,singles=0;
for(var i=0;i<words.length;i++){
var w=words[i];
if(w.length===1&&!/[aAI]/.test(w)) singles++;
if(w.length>=3&&!/[aeiouAEIOU]/.test(w)&&/[a-zA-Z]{3,}/.test(w)) weird++;
}
return weird/words.length>0.35||singles/words.length>0.3;
}
function prepImg(file){
return new Promise(function(resolve){
var img=new Image(), url=URL.createObjectURL(file);
img.onload=function(){
try{
var maxW=1400, scale=img.width>maxW?maxW/img.width:(img.width<600?1.8:1.1);
var w=Math.round(img.width*scale), h=Math.round(img.height*scale);
var c=document.createElement("canvas"); c.width=w; c.height=h;
var ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
var id=ctx.getImageData(0,0,w,h), d=id.data;
for(var i=0;i<d.length;i+=4){
var g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; g=(g-128)*1.3+128;
if(g<0)g=0; if(g>255)g=255; if(g>200)g=255; else if(g<90)g=0;
d[i]=d[i+1]=d[i+2]=g;
}
ctx.putImageData(id,0,0); URL.revokeObjectURL(url);
c.toBlob(function(b){ resolve(b||file); },"image/png");
}catch(e){ URL.revokeObjectURL(url); resolve(file); }
};
img.onerror=function(){ URL.revokeObjectURL(url); resolve(file); };
img.src=url;
});
}
function runOCR(file, cb, stEl){
if(stEl){ stEl.textContent="Reading…"; stEl.className="status"; }
if(typeof Tesseract==="undefined"){ if(stEl) stEl.textContent="Photo added. Type the text."; cb(""); return; }
prepImg(file).then(function(img){
return Tesseract.recognize(img,"eng",{logger:function(m){
if(stEl && m && m.status==="recognizing text" && m.progress) stEl.textContent="Reading… "+Math.round(m.progress*100)+"%";
}});
}).then(function(r){
var t=(r&&r.data&&r.data.text)?r.data.text.replace(/\s+\n/g,"\n").replace(/[ \t]+/g," ").trim():"";
if(t && t.length>5 && !isGib(t)){ if(stEl){ stEl.textContent="Text ready."; stEl.className="status ok"; } cb(t); }
else { if(stEl){ stEl.textContent="Could not read clearly. Type below."; stEl.className="status warn"; } cb(""); }
}).catch(function(){ if(stEl){ stEl.textContent="Could not read photo."; stEl.className="status err"; } cb(""); });
}
function addMsg(who,text){
var d=document.createElement("div"); d.className="msg "+who; d.textContent=text;
$("chat").appendChild(d); $("chat").scrollTop=$("chat").scrollHeight; return d;
}
function addHtml(html){
var d=document.createElement("div"); d.className="msg bot"; d.innerHTML=html;
$("chat").appendChild(d); $("chat").scrollTop=$("chat").scrollHeight; return d;
}
addMsg("bot","Ask about any subject or book.\nExample: Restart by Gordon Korman\nUse + for photos or the mic to speak.");
var mem={title:"",author:""};
function doResearch(){
var input=$("r-input"), msg=input.value.trim();
if(!msg) return;
addMsg("user", msg); input.value="";
var live=addMsg("bot",""); live.innerHTML='<span class="live">Searching…</span>';
var title=msg, author="";
var by=msg.match(/(.+?)\s+by\s+(.+)/i);
if(by){ title=by[1].trim(); author=by[2].trim(); }
if(mem.title && /^(by|author)/i.test(msg)){
author=msg.replace(/^(by|author is|the author is|author|written by)\s+/i,"").trim();
title=mem.title;
}
mem.title=title; if(author) mem.author=author;
var url="https://openlibrary.org/search.json?title="+encodeURIComponent(title)+(author?"&author="+encodeURIComponent(author):"")+"&limit=6";
fetch(url).then(function(r){ return r.json(); }).then(function(data){
var docs=(data.docs||[]).filter(function(d){ return d.title && !/goku|dragon.?ball|anime|manga/i.test(d.title||""); });
if(!docs.length){
return fetch("https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch="+encodeURIComponent(title+(author?" "+author:""))+"&srlimit=3&format=json&origin=*")
.then(function(r){ return r.json(); })
.then(function(w){
var s=((w.query&&w.query.search)||[])[0];
if(!s){ live.textContent="No match. Try: Restart by Gordon Korman"; return; }
return fetch("https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&exchars=1200&titles="+encodeURIComponent(s.title)+"&format=json&origin=*")
.then(function(r){ return r.json(); })
.then(function(ex){
var pages=ex.query&&ex.query.pages||{};
var k=Object.keys(pages)[0];
var text=(pages[k]&&pages[k].extract)||"";
if(live.parentNode) live.parentNode.removeChild(live);
addHtml("<strong>"+esc(s.title)+"</strong><br/><br/>"+esc(text.slice(0,800)));
});
});
}
var d=docs[0];
mem.title=d.title; mem.author=(d.author_name||[]).join(", ");
return fetch("https://openlibrary.org"+d.key+".json").then(function(r){ return r.json(); }).then(function(full){
var desc="";
var de=full.description; if(de&&typeof de==="object") de=de.value;
if(typeof de==="string") desc=de.replace(/\s+/g," ").slice(0,600);
if(!desc && d.subject) desc="Tags: "+(d.subject||[]).slice(0,4).join(", ");
if(!desc) desc="Book by "+((d.author_name||[]).join(", ")||"unknown")+(d.first_publish_year?" · "+d.first_publish_year:"");
if(live.parentNode) live.parentNode.removeChild(live);
var html="";
if(d.cover_i) html+='<div class="book"><img src="https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg" onerror="this.style.display=\'none\'"/><div>';
html+="<strong>"+esc(d.title)+"</strong><br/><span style=\"color:#8e8e8e;font-size:13px\">"+esc((d.author_name||[]).join(", ")+(d.first_publish_year?" · "+d.first_publish_year:""))+"</span><br/><br/>"+esc(desc);
if(d.cover_i) html+="</div></div>";
addHtml(html);
addMsg("bot","Wrong book? Type the author.");
}).catch(function(){
if(live.parentNode) live.parentNode.removeChild(live);
addMsg("bot", d.title+" by "+((d.author_name||[]).join(", ")||"?"));
});
}).catch(function(e){
if(live.parentNode) live.parentNode.removeChild(live);
addMsg("bot","Error: "+(e.message||e));
});
}
var hwMode="explain", hwQs=[], hwSubj="general";
var SUBJECTS=[{id:"english",label:"English / Reading"},{id:"math",label:"Math"},{id:"science",label:"Science"},{id:"history",label:"History"},{id:"general",label:"General"}];
function hwStep(n){
var steps=$("hw-steps").children;
for(var i=0;i<steps.length;i++) steps[i].className="step"+(i+1<n?" done":(i+1===n?" on":""));
$("hs1").style.display=n===1?"block":"none";
$("hs2").style.display=n===2?"block":"none";
$("hs3").style.display=n===3?"block":"none";
$("hs4").style.display=n===4?"block":"none";
}
function setMode(el,v){
var all=el.parentNode.querySelectorAll(".chip");
for(var i=0;i<all.length;i++) all[i].classList.remove("on");
el.classList.add("on"); hwMode=v;
}
function hwPhoto(input){
var f=input.files&&input.files[0]; if(!f) return;
if(f.type && f.type.indexOf("image")===0){
try{ $("hw-img").src=URL.createObjectURL(f); $("hw-img").style.display="block"; }catch(e){}
runOCR(f, function(text){
if(text) $("hw-text").value = $("hw-text").value ? ($("hw-text").value+"\n\n"+text) : text;
}, $("hw-st"));
} else {
$("hw-st").textContent="File: "+f.name+". Paste or type the questions.";
}
}
function hwNext1(){
var t=$("hw-text").value.trim();
if(!t){ $("hw-st").textContent="Add a photo or type text."; $("hw-st").className="status warn"; return; }
hwQs=t.split(/\n/).filter(function(l){ return l.trim().length>5; }).slice(0,12).map(function(q,i){ return {n:i+1,text:q.trim().slice(0,300)}; });
if(!hwQs.length) hwQs=[{n:1,text:t.slice(0,300)}];
hwSubj=/fable|aesop|story|theme|poem/i.test(t)?"english":(/\d\s*[+\-*=]|solve|equation/i.test(t)?"math":"general");
var box=$("hw-qs"); box.innerHTML="";
for(var i=0;i<hwQs.length;i++){
var d=document.createElement("div"); d.className="qitem";
d.innerHTML='<input type="checkbox" id="qq'+i+'" checked/><label for="qq'+i+'"><strong>#'+hwQs[i].n+'</strong> — '+esc(hwQs[i].text)+'</label>';
box.appendChild(d);
}
hwStep(2);
}
function hwNext2(){
var lab="General"; for(var i=0;i<SUBJECTS.length;i++) if(SUBJECTS[i].id===hwSubj) lab=SUBJECTS[i].label;
$("hw-subj").textContent=lab; $("hw-subj-st").textContent="Suggested: "+lab; hwStep(3);
}
function pickSubj(){
var list=$("subj-list"); list.innerHTML="";
SUBJECTS.forEach(function(s){
var b=document.createElement("button"); b.type="button"; b.className="sheet-btn"; b.textContent=s.label;
b.onclick=function(){ hwSubj=s.id; $("hw-subj").textContent=s.label; $("ov").classList.remove("open"); };
list.appendChild(b);
});
$("ov").classList.add("open");
}
function hwGo(){
var selected=[];
for(var i=0;i<hwQs.length;i++){ var cb=$("qq"+i); if(cb&&cb.checked) selected.push(hwQs[i]); }
if(!selected.length) selected=hwQs.slice(0,1);
var lab=hwSubj; for(var i=0;i<SUBJECTS.length;i++) if(SUBJECTS[i].id===hwSubj) lab=SUBJECTS[i].label;
var lines=["Subject: "+lab, "Mode: "+hwMode, ""];
for(var i=0;i<selected.length;i++){
lines.push("────────","Question #"+selected[i].n, selected[i].text, "");
if(hwMode!=="answer") lines.push("1. Restate the question","2. Use a detail from the text","3. Explain your thinking");
if(hwMode!=="explain") lines.push("Answer in complete sentences.","Draft: _______________");
lines.push("");
}
$("hw-out").innerHTML='<div class="meta">Homework · '+esc(lab)+'</div>'+esc(lines.join("\n"));
hwStep(4);
}
function hwReset(){ $("hw-text").value=""; $("hw-st").textContent=""; $("hw-img").style.display="none"; hwStep(1); }
var nStyle="short";
function setNStyle(el,v){
var all=el.parentNode.querySelectorAll(".chip");
for(var i=0;i<all.length;i++) all[i].classList.remove("on");
el.classList.add("on"); nStyle=v;
}
function notesPhoto(input){
var f=input.files&&input.files[0]; if(!f) return;
if(f.type && f.type.indexOf("image")===0){
try{ $("n-img").src=URL.createObjectURL(f); $("n-img").style.display="block"; }catch(e){}
runOCR(f, function(text){
if(text) $("n-text").value = $("n-text").value ? ($("n-text").value+"\n\n"+text) : text;
}, $("n-st"));
} else {
$("n-st").textContent="File: "+f.name+". Paste text if needed.";
}
}
function notesFetch(){
var url=$("n-url").value.trim();
if(!url){ $("n-st").textContent="Paste a link first."; return; }
if(!/^https?:\/\//i.test(url)) url="https://"+url;
$("n-st").textContent="Loading…";
fetch("https://r.jina.ai/"+url).then(function(r){ return r.text(); }).then(function(t){
$("n-text").value=t.trim().slice(0,15000); $("n-st").textContent="Loaded."; $("n-st").className="status ok";
}).catch(function(){ $("n-st").textContent="Could not load. Paste text."; $("n-st").className="status warn"; });
}
function makeNotes(){
var raw=$("n-text").value.trim();
if(!raw){ $("n-out").className="panel show"; $("n-out").textContent="Add text first."; return; }
var sents=raw.replace(/\s+/g," ").split(/[.!?]+/).filter(function(s){ return s.trim().length>20; });
if(!sents.length) sents=[raw.slice(0,200)];
var n=nStyle==="short"?Math.min(6,sents.length):nStyle==="medium"?Math.min(10,sents.length):Math.min(14,sents.length);
var lines=[nStyle.charAt(0).toUpperCase()+nStyle.slice(1)+" notes",""];
for(var i=0;i<n;i++) lines.push("• "+sents[i].trim().slice(0,160));
$("n-out").className="panel show";
$("n-out").innerHTML='<div class="meta">Notes</div>'+esc(lines.join("\n"));
}
hwStep(1);
</script>
</body>
</html>
